<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Регистрация — Портал посещаемости</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Регистрация старосты</h1>
      </div>
      <nav>
        <a class="nav-link" href="/">Главная</a>
      </nav>
    </div>
  </header>
  <main>
    <section>
      <h2>Регистрация старосты</h2>
      <% if (error) { %>
        <div class="flash error"><%= error %></div>
      <% } %>
      <form method="post">
        <label>Имя старосты<br><input type="text" name="name" required></label>
        <label>Телефон<br><input type="tel" name="phone" required></label>
        <label>Пароль<br><input type="password" name="password" required></label>
        <label>Название группы<br><input type="text" name="group_name" required></label>
        <label>Куратор<br><input type="text" name="curator" required></label>
        <label>Список группы (по одной фамилии на строку)<br><textarea name="members" rows="8" required></textarea></label>
        <div class="form-actions">
          <button type="submit">Зарегистрироваться</button>
          <a class="button button-secondary" href="/">На главную</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
